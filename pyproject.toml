[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-time-transport-data-lakehouse"
version = "0.1.0"
description = "Local-first data platform skeleton for GTFS Static and Realtime transport data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Real-Time Transport Data Lakehouse project" },
]
dependencies = [
    "pyspark>=3.5,<4.0",
    "boto3>=1.43,<2.0",
    "requests>=2.31,<3.0",
    "kafka-python>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "prefect>=3.0,<4.0",
    "gtfs-realtime-bindings>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "integration: tests that interact with external services such as AWS S3",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
